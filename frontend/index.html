<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disney Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #050B2E;
    --royal: #163E9E;
    --royal-light: #3D6FD1;
    --glow: #9FC6FF;
    --white-blue: #EAF2FF;
    --magenta: #FF6FA5;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(159,198,255,0.16);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 600px at 50% -10%, rgba(159,198,255,0.35), transparent 60%),
                linear-gradient(180deg, var(--deep) 0%, #081653 45%, #030716 100%);
    font-family: 'Inter', sans-serif;
    color: var(--white-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle 3.5s ease-in-out infinite;
  }

  .star.big {
    width: 3px;
    height: 3px;
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.6);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.4); }
  }

  .sparkle {
    position: absolute;
    font-size: 13px;
    color: var(--glow);
    opacity: 0;
    animation: drift 8s linear infinite;
    filter: drop-shadow(0 0 5px rgba(159,198,255,0.8));
  }

  @keyframes drift {
    0% { opacity: 0; transform: translateY(0) translateX(0) rotate(0deg); }
    10% { opacity: 0.85; }
    90% { opacity: 0.85; }
    100% { opacity: 0; transform: translateY(-120px) translateX(20px) rotate(60deg); }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: 0 30px 90px rgba(2,6,30,0.7), 0 0 60px rgba(61,111,209,0.15), 0 0 0 1px rgba(255,255,255,0.03) inset;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 82vh;
    max-height: 780px;
  }

  header {
    padding: 36px 32px 26px;
    text-align: center;
    position: relative;
    border-bottom: 1px solid var(--glass-border);
    background: radial-gradient(ellipse 380px 200px at 50% 0%, rgba(159,198,255,0.22), transparent 70%);
  }

  /* Abstract arc of light -- inspired by the reference's glowing halo, not a literal shape */
  .arc {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 130px;
    border-radius: 50%;
    border-top: 2px solid rgba(234,242,255,0.45);
    border-left: 2px solid transparent;
    border-right: 2px solid transparent;
    filter: drop-shadow(0 0 8px rgba(159,198,255,0.55));
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--glow);
    font-weight: 600;
    margin-bottom: 10px;
    opacity: 0.9;
    position: relative;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    margin: 0;
    font-weight: 800;
    letter-spacing: 0.01em;
    position: relative;
    background: linear-gradient(100deg, var(--white-blue) 15%, #fff 35%, var(--glow) 50%, #fff 65%, var(--white-blue) 85%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
    text-shadow: 0 0 30px rgba(159,198,255,0.35);
  }

  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 220% center; }
  }

  .subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: rgba(234,242,255,0.55);
    font-style: italic;
    position: relative;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb {
    background: rgba(159,198,255,0.18);
    border-radius: 10px;
  }

  .msg {
    max-width: 80%;
    padding: 13px 17px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: 15px;
    animation: rise 0.3s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.bot {
    align-self: flex-start;
    background: rgba(159,198,255,0.08);
    border: 1px solid rgba(159,198,255,0.28);
    box-shadow: 0 0 20px rgba(61,111,209,0.12);
    color: var(--white-blue);
    border-radius: 4px 16px 16px 16px;
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--magenta), #C9508C);
    color: #fff;
    border-radius: 16px 4px 16px 16px;
    box-shadow: 0 4px 18px rgba(255,111,165,0.25);
  }

  .msg.typing {
    align-self: flex-start;
    background: rgba(159,198,255,0.06);
    border: 1px solid rgba(159,198,255,0.25);
    border-radius: 4px 16px 16px 16px;
    color: var(--glow);
    font-style: italic;
    font-size: 14px;
  }

  .msg.error {
    align-self: flex-start;
    font-size: 13px;
    color: var(--magenta);
    background: rgba(255,111,165,0.08);
    border: 1px solid rgba(255,111,165,0.25);
  }

  form {
    display: flex;
    gap: 10px;
    padding: 18px 20px;
    border-top: 1px solid var(--glass-border);
    background: rgba(159,198,255,0.02);
  }

  input[type="text"] {
    flex: 1;
    padding: 13px 17px;
    border-radius: 12px;
    border: 1.5px solid rgba(159,198,255,0.2);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    background: rgba(159,198,255,0.06);
    color: var(--white-blue);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  input[type="text"]::placeholder {
    color: rgba(234,242,255,0.35);
  }

  input[type="text"]:focus {
    border-color: var(--glow);
    box-shadow: 0 0 0 3px rgba(159,198,255,0.18);
  }

  button {
    padding: 13px 24px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--glow), var(--royal-light));
    color: #050B2E;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 16px rgba(61,111,209,0.4);
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(61,111,209,0.55);
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--magenta);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg, .star, .sparkle, h1 { animation: none !important; }
  }

  @media (max-width: 480px) {
    .app { height: 92vh; border-radius: 16px; }
    h1 { font-size: 26px; }
    header { padding: 30px 20px 22px; }
    .arc { width: 200px; height: 100px; top: -45px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
  <header>
    <div class="arc"></div>
    <div class="eyebrow">A Tale As Old As Code</div>
    <h1>Disney Chatbot</h1>
    <div class="subtitle">Ask me anything from the Disney universe</div>
  </header>

  <div class="messages" id="messages">
    <div class="msg bot">Welcome! Ask me about a Disney movie, the company, or anything else Disney-related.</div>
  </div>

  <form id="chat-form">
    <input
      type="text"
      id="chat-input"
      placeholder="What is your question?"
      autocomplete="off"
      required
    >
    <button type="submit" id="send-btn">Ask</button>
  </form>
</div>

<script>
  // Change this to your deployed backend URL when you deploy.
  const API_URL = "https://disney-chatbot-4cgp.onrender.com/chat";

  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const messages = document.getElementById("messages");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(text, role) {
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;

    const typingEl = addMessage("Thinking…", "typing");

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: question }),
      });

      if (!response.ok) {
        throw new Error(`Server responded with ${response.status}`);
      }

      const data = await response.json();
      typingEl.remove();
      addMessage(data.response, "bot");
    } catch (err) {
      typingEl.remove();
      addMessage(
        "Couldn't reach the chatbot backend. Is it running at " + API_URL + "?",
        "error"
      );
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  (function buildStars() {
    const container = document.getElementById("stars");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const starCount = prefersReducedMotion ? 0 : 45;
    const sparkleCount = prefersReducedMotion ? 0 : 6;

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement("div");
      star.className = "star" + (Math.random() > 0.85 ? " big" : "");
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.animationDelay = (Math.random() * 3.5) + "s";
      container.appendChild(star);
    }

    for (let i = 0; i < sparkleCount; i++) {
      const sparkle = document.createElement("div");
      sparkle.className = "sparkle";
      sparkle.textContent = "✦";
      sparkle.style.left = Math.random() * 100 + "%";
      sparkle.style.bottom = (Math.random() * 30) + "%";
      sparkle.style.animationDelay = (Math.random() * 8) + "s";
      sparkle.style.animationDuration = (6 + Math.random() * 4) + "s";
      container.appendChild(sparkle);
    }
  })();
</script>

</body>
</html>
